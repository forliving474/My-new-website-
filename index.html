
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      color: #222;
      text-align: center;
      padding: 60px 20px;
    }

    .card {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #0001;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, world! 👋</h1>
    <p>Welcome to my first website.</p>
    <p>I'm learning how to code!</p>

    <button onclick="sayHello()">Click me</button>
    <p id="message"></p>
  </div>

  <script>
    function sayHello() {
      document.getElementById("message").textContent =
        "Congratulations! Your website is working!";
    }
  </script>
</body>
</html>
